[project]
name = "curator-local"
version = "0.1.0"
description = "Read-only local document and code inventory"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pdfplumber>=0.11,<0.12",
    "markdown-it-py>=3",
    "PyYAML>=6",
    "chardet>=5,<6",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-java>=0.23,<0.24",
    "portalocker>=3,<4",
    "httpx>=0.28,<0.29",
]
[project.scripts]
curator = "curator.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/curator"]
[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "types-PyYAML"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["examples/review"]
line-length = 100
