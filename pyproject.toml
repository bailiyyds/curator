[project]
name = "curator-local"
version = "0.1.0"
description = "Read-only local document and code inventory"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2"]
[project.scripts]
curator = "curator.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/curator"]
[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
pythonpath = ["src"]
